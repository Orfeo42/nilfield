name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom-gcl:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # golangci-lint-action always runs the linter and has no install-only mode,
      # so a lint failure there would block publishing the asset. Install the
      # pinned binary directly instead; `golangci-lint custom` then compiles the
      # version named in .custom-gcl.yml with the plugin from this checkout.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Build custom-gcl
        run: golangci-lint custom

      - name: Rename asset
        run: mv .cache/custom-gcl custom-gcl-linux-amd64

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" custom-gcl-linux-amd64 --clobber
