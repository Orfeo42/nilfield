name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: nilfield on its own source
        continue-on-error: true
        run: |
          go build -o /tmp/nilfield ./cmd/nilfield
          /tmp/nilfield ./...
